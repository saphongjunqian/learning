_schema-version: 3.3.0
ID: acfinance
version: 1.0.3
description: "Accounting service and the Fiori apps."
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

modules:
  - name: ac-finance-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      readiness-health-check-type: http
      readiness-health-check-http-endpoint: /health
      memory: 256M
      disk-quota: 256M
    build-parameters:
      builder: npm
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: ac-finance-auth
      - name: fqm-btp-hana-hdi

  - name: ac-finance-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: fqm-btp-hana-hdi

  - name: ac-finance-destination-content
    type: com.sap.application.content
    requires:
      - name: ac-finance-destination-service
        parameters:
          content-target: true
      - name: ac-finance_html_repo_host
        parameters:
          service-key:
            name: ac-finance_html_repo_host-key
      - name: ac-finance-auth
        parameters:
          service-key:
            name: ac-finance-auth-key
    parameters:
      content:
        instance:
          destinations:
            - Name: ac-finance_html_repo_host
              ServiceInstanceName: ac-finance-html5-app-host-service
              ServiceKeyName: ac-finance_html_repo_host-key
              sap.cloud.service: finance.service
            - Authentication: OAuth2UserTokenExchange
              Name: ac-finance_auth
              ServiceInstanceName: ac-finance-auth
              ServiceKeyName: ac-finance-key
              sap.cloud.service: finance.service
          existing_destinations_policy: ignore
    build-parameters:
      no-source: true

  - name: ac-finance-app-content
    type: com.sap.application.content
    path: .
    requires:
      - name: ac-finance_html_repo_host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - artifacts:
            - accountsapp.zip
          name: accountapp
          target-path: resources/
        - artifacts:
            - accountcategoriesapp.zip
          name: accountcategoryapp
          target-path: resources/
        - artifacts:
            - organizationsapp.zip
          name: organizationapp
          target-path: resources/
        - artifacts:
            - transactiontypesapp.zip
          name: transactiontypeapp
          target-path: resources/
        - artifacts:
            - documentsapp.zip
          name: documentapp
          target-path: resources/

  - name: accountcategoryapp
    type: html5
    path: app/accountcategories
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms:
        []

  - name: accountapp
    type: html5
    path: app/accounts
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms:
        []

  - name: organizationapp
    type: html5
    path: app/organizations
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms:
        []

  - name: transactiontypeapp
    type: html5
    path: app/transactiontypes
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms:
        []

  - name: documentapp
    type: html5
    path: app/documents
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms:
        []

resources:
  - name: fqm-btp-hana-hdi
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  - name: ac-finance-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: ac-finance-${space}
        tenant-mode: dedicated

  - name: ac-finance-destination-service
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            destinations:
              - Authentication: NoAuthentication
                Name: ui5
                ProxyType: Internet
                Type: HTTP
                URL: https://ui5.sap.com
              - Authentication: NoAuthentication
                HTML5.DynamicDestination: true
                HTML5.ForwardAuthToken: true
                Name: ac-finance-srv-api
                ProxyType: Internet
                Type: HTTP
                URL: ~{srv-api/srv-url}
            existing_destinations_policy: update
        version: 1.0.0
      service: destination
      service-name: ac-finance-destination-service
      service-plan: lite
    requires:
      - name: srv-api

  - name: ac-finance_html_repo_host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-name: ac-finance-html5-app-host-service
      service-plan: app-host
