_schema-version: "3.1"
ID: ac-learning
description: AC learning, built with SAP CAP.
version: 1.1.6
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

modules:
  - name: ac-learning-srv
    type: nodejs
    path: gen/srv
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
      disk-quota: 1024M
    build-parameters:
      builder: npm-ci
    requires:
      - name: fqm-btp-hana-hdi
      - name: ac-learning-auth

  - name: ac-learning-db-deployer
    type: hdb
    path: gen/db
    requires:
      - name: fqm-btp-hana-hdi
    parameters:
      buildpack: nodejs_buildpack

  - name: ac-learning-destination-content
    type: com.sap.application.content
    requires:
      - name: ac-learning-destination-service
        parameters:
          content-target: true
      - name: ac-learning_html_repo_host
        parameters:
          service-key:
            name: ac-learning_html_repo_host-key
      - name: ac-learning-auth
        parameters:
          service-key:
            name: ac-learning-auth-key
    parameters:
      content:
        instance:
          destinations:
            - Name: ac_learning_html_repo_host
              ServiceInstanceName: ac-learning-html5-app-host-service
              ServiceKeyName: ac-learning_html_repo_host-key
              sap.cloud.service: learning.service
            - Authentication: OAuth2UserTokenExchange
              Name: ac_learning_auth
              ServiceInstanceName: ac-learning-auth
              ServiceKeyName: ac-learning-auth-key
              sap.cloud.service: learning.service
          existing_destinations_policy: ignore
    build-parameters:
      no-source: true

  - name: ac-learning-app-content
    type: com.sap.application.content
    path: .
    requires:
      - name: ac-learning_html_repo_host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - artifacts:
            - wordcollectionapp.zip
          name: wordcollectionapp
          target-path: resources/

  - name: wordcollectionapp
    type: html5
    path: app/wordcollection
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms:
        []

resources:
  - name: fqm-btp-hana-hdi
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: ac-learning-auth
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        tenant-mode: dedicated
        xsappname: ac-learning-${space}
      path: ./xs-security.json
      service: xsuaa
      service-plan: application
  - name: ac-learning-destination-service
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            destinations:
              - Authentication: NoAuthentication
                Name: ui5
                ProxyType: Internet
                Type: HTTP
                URL: https://ui5.sap.com
              - Authentication: NoAuthentication
                HTML5.DynamicDestination: true
                HTML5.ForwardAuthToken: true
                Name: ac-learning-srv-api
                ProxyType: Internet
                Type: HTTP
                URL: ~{srv-api/srv-url}
            existing_destinations_policy: update
        version: 1.0.0
      service: destination
      service-name: ac-learning-destination-service
      service-plan: lite
    requires:
      - name: srv-api

  - name: ac-learning_html_repo_host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-name: ac-learning-html5-app-host-service
      service-plan: app-host
