_schema-version: "3.1"
ID: ac-toolset
description: AC toolset, built with SAP CAP.
version: 1.1.3
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
  - builder: custom
    commands:
    - npm ci
    - npx cds build --production

modules:
- name: ac-toolset-srv
  type: nodejs
  path: gen/srv
  provides:
  - name: srv-api
    properties:
      srv-url: ${default-url}
  parameters:
    buildpack: nodejs_buildpack
  build-parameters:
    builder: npm-ci
  requires:
  - name: fqm-btp-hana-hdi
  - name: ac-toolset-auth

- name: ac-toolset-db-deployer
  type: hdb
  path: gen/db
  requires:
  - name: fqm-btp-hana-hdi
  parameters:
    buildpack: nodejs_buildpack

- name: ac-toolset-destination-content
  type: com.sap.application.content
  requires:
  - name: ac-toolset-destination-service
    parameters:
      content-target: true
  - name: ac-toolset_html_repo_host
    parameters:
      service-key:
        name: ac-toolset_html_repo_host-key
  - name: ac-toolset-auth
    parameters:
      service-key:
        name: ac-toolset-auth-key
  parameters:
    content:
      instance:
        destinations:
        - Name: btp_ac_toolset_html_repo_host
          ServiceInstanceName: ac-toolset-html5-app-host-service
          ServiceKeyName: ac-toolset_html_repo_host-key
          sap.cloud.service: ac
        - Authentication: OAuth2UserTokenExchange
          Name: btp_ac_toolset_auth
          ServiceInstanceName: ac-toolset-auth
          ServiceKeyName: ac-toolset-auth-key
          sap.cloud.service: ac
        existing_destinations_policy: ignore
  build-parameters:
    no-source: true

- name: ac-toolset-app-content
  type: com.sap.application.content
  path: .
  requires:
  - name: ac-toolset_html_repo_host
    parameters:
      content-target: true
  build-parameters:
    build-result: resources
    requires:
    - artifacts:
      - wordcollectionapp.zip
      name: wordcollectionapp
      target-path: resources/

- name: wordcollectionapp
  type: html5
  path: app/wordcollection
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []

resources:
- name: fqm-btp-hana-hdi
  type: com.sap.xs.hdi-container
  parameters:
    service: hana
    service-plan: hdi-shared
- name: ac-toolset-auth
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      tenant-mode: dedicated
      xsappname: ac-toolset-${space}
    path: ./xs-security.json
    service: xsuaa
    service-plan: application
- name: ac-toolset-destination-service
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: true
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          - Authentication: NoAuthentication
            HTML5.DynamicDestination: true
            HTML5.ForwardAuthToken: true
            Name: ac-toolset-srv-api
            ProxyType: Internet
            Type: HTTP
            URL: ~{srv-api/srv-url}
          existing_destinations_policy: update
      version: 1.0.0
    service: destination
    service-name: ac-toolset-destination-service
    service-plan: lite
  requires:
  - name: srv-api
- name: ac-toolset_html_repo_host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-name: ac-toolset-html5-app-host-service
    service-plan: app-host
