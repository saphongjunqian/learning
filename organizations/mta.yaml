_schema-version: 3.3.0
ID: organizations
version: 1.0.0
description: "A simple CAP project."
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

modules:
  - name: organization-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      readiness-health-check-type: http
      readiness-health-check-http-endpoint: /health
    build-parameters:
      builder: npm
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: organization-auth
      - name: fqm-btp-hana-hdi

  - name: organization-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: fqm-btp-hana-hdi

  - name: organization-destination-content
    type: com.sap.application.content
    requires:
      - name: organization-destination-service
        parameters:
          content-target: true
      - name: organization_html_repo_host
        parameters:
          service-key:
            name: organization_html_repo_host-key
      - name: organization-auth
        parameters:
          service-key:
            name: organization-auth-key
    parameters:
      content:
        instance:
          destinations:
            - Name: btp_organization_html_repo_host
              ServiceInstanceName: organization-html5-app-host-service
              ServiceKeyName: organization_html_repo_host-key
              sap.cloud.service: aclearning
            - Authentication: OAuth2UserTokenExchange
              Name: btp_organization_auth
              ServiceInstanceName: organization-auth
              ServiceKeyName: ac-organization-key
              sap.cloud.service: aclearning
          existing_destinations_policy: ignore
    build-parameters:
      no-source: true

  - name: organization-app-content
    type: com.sap.application.content
    path: .
    requires:
      - name: organization_html_repo_host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - artifacts:
            - organizationsapp.zip
          name: organizationapp
          target-path: resources/

  - name: organizationapp
    type: html5
    path: app/organizations
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms:
        []

resources:
  - name: fqm-btp-hana-hdi
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  
  - name: organization-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: aclearning-organization-${space}
        tenant-mode: dedicated

  - name: organization-destination-service
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            destinations:
              - Authentication: NoAuthentication
                Name: ui5
                ProxyType: Internet
                Type: HTTP
                URL: https://ui5.sap.com
              - Authentication: NoAuthentication
                HTML5.DynamicDestination: true
                HTML5.ForwardAuthToken: true
                Name: organization-srv-api
                ProxyType: Internet
                Type: HTTP
                URL: ~{srv-api/srv-url}
            existing_destinations_policy: update
        version: 1.0.0
      service: destination
      service-name: organization-destination-service
      service-plan: lite
    requires:
      - name: srv-api

  - name: organization_html_repo_host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-name: organization-html5-app-host-service
      service-plan: app-host
